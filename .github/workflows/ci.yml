name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes no major-version tags
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check
      - run: make dbt-sample

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/airflow.Dockerfile -t atalayero-airflow:ci .
      # The DAGs load in Airflow's Python, and the project's environment in the image imports the
      # package (ADR-0021).
      - run: >-
          docker run --rm -e ATALAYERO_ROOT="$PWD" -v "$PWD:$PWD:ro" -w "$PWD"
          atalayero-airflow:ci python airflow/tests/check_dags.py
      # The image's entrypoint runs any other program as an `airflow` subcommand: bypass it.
      - run: >-
          docker run --rm -e PYTHONPATH="$PWD/src" -v "$PWD:$PWD:ro" -w "$PWD"
          --entrypoint /opt/atalayero/venv/bin/python atalayero-airflow:ci -c
          "import lightgbm, atalayero.batch.day, atalayero.models.registry, atalayero.agent.run, atalayero.mcp_server.server"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/api.Dockerfile -t atalayero-api:ci .
      # The image's environment imports the API, as its unprivileged user (ADR-0022).
      - run: >-
          docker run --rm -e PYTHONPATH="$PWD/src" -v "$PWD:$PWD:ro" -w "$PWD" --read-only
          --entrypoint /opt/atalayero/venv/bin/python atalayero-api:ci -c
          "import atalayero.api.app"
      # The gateway's configuration is valid nginx (the API's host resolved by hand).
      - run: >-
          docker run --rm --add-host api:127.0.0.1
          -v "$PWD/docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
