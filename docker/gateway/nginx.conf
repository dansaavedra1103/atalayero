# The gateway in front of the API (ADR-0022): the only way in, published on localhost only. It
# throttles each client, caps connections, refuses writes and bodies, times out slow clients, and
# hides what it runs. The API keeps its own checks behind it.

limit_req_zone $binary_remote_addr zone=per_client:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=per_client_connections:10m;
limit_req_status 429;
limit_conn_status 429;
server_tokens off;

upstream api {
    server api:8000;
    keepalive 8;
}

server {
    listen 8080;

    # Slow or oversized requests go no further.
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;

    limit_conn per_client_connections 20;

    # The API sets these too; the gateway owns them, on its own error pages as well.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    location / {
        limit_except GET {  # GET and HEAD only: the API reads
            deny all;
        }
        # Throttling: up to 10 requests a second per client; a burst of 20 more waits its turn,
        # and beyond it the gateway answers 429.
        limit_req zone=per_client burst=20;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Replace, never append: a client cannot forge the address the API rate-limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 15s;
    }
}
