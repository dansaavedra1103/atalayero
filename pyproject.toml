[project]
name = "atalayero"
version = "0.1.0"
description = "AML/fraud transaction monitoring with versioned rules, ML models and an evaluated LLM investigator agent"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Ordoñez" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "networkx>=3.6.1",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
# Markdown docs are not code; keep ruff to .py files (same scope as the pre-commit hooks).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = ["integration: needs external services (Docker, network); not run in CI"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
