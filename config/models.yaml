# `version` and adds a `history` entry with the reason, as for the rules.
# `negative_rate`: share of clean training rows kept; every laundering row is kept.
version: '1.1'
families:
  logistic_regression:
    params:
      C: 6.238155402018423
      class_weight: null
      negative_rate: 0.08054641489830232
  lightgbm:
    params:
      n_estimators: 500
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 100
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      negative_rate: 0.1
  isolation_forest:
    params:
      n_estimators: 391
      max_samples: 6265
      max_features: 0.5806106015226714
history:
