# The investigator agent (ADR-0018). Versioned like the rules and the models: any change to the
# model, its options, the limits or the prompts in src/atalayero/agent/prompts/ bumps `version`
# and adds a `history` entry with the reason. The model's digest is pinned in
# config/settings.yaml (`ollama.models`).
version: "1.4"
model: "gpt-oss:20b"
think: low  # gpt-oss reasoning effort: low, medium or high
options:  # Ollama options
  temperature: 0
  seed: 0
  num_ctx: 16384
# The model's call (ADR-0019): it escalates the account-days ranked within this many of their day,
# and the agent cannot close them; the rest the agent escalates on a red flag. The score-only
# baseline's threshold, fit on the dev set.
model_call_rank: 1133
max_steps: 12  # tool calls per investigation
max_grounding_retries: 2  # times a report that fails verification goes back to investigation
amount_tolerance: 0.01  # relative difference allowed between a cited and a real amount
history:
  - version: "1.0"
    date: "2026-10-06"
    reason: "First version, before any evaluation (ADR-0018)"
  - version: "1.1"
    date: "2026-10-07"
    reason: >-
      v1.0 closed 87 of 90 dev cases (primary 34.4% vs 81.1% for score-only): it looked at the
      graph in 10 cases and anchored on low scores. The investigation prompt now requires the
      graph and the score explanation before concluding, says a score is no evidence either way,
      asks for a stated ordinary explanation to close, and lists money-flow red flags
  - version: "1.2"
    date: "2026-10-07"
    reason: >-
      v1.1 still closed 85 of 90 dev cases (36.7%): from an account's own tools a pattern rarely
      shows, and the prompt told the agent to ignore the rank, which alone gets 81.1% on dev. The
      agent now starts from the model's call (ADR-0019) and changes it only on concrete evidence;
      the neighbourhood shows how many accounts each counterparty pays and is paid by
  - version: "1.3"
    date: "2026-10-07"
    reason: >-
      v1.2 closed all 11 dev cases it reached before the run stopped, overriding the model's call
      to escalate in 7 of 7, all of them laundering, with "no pattern, normal activity". The
      model's call to escalate now stands, enforced by the draft's schema; the agent names its
      typology and evidence, and escalates an alert the model would close on a red flag
  - version: "1.4"
    date: "2026-10-07"
    reason: >-
      v1.3 got 30 of the first 37 dev cases right, against 32 for score-only: it overrode the
      model's close twice, both clean, each on one red flag (a counterparty paying 7 accounts;
      the inflows that raised an R01 alert). Among the model's closes on dev, each red flag we
      measured shows on more clean alerts than laundering ones. Escalating a model close now takes
      two red flags, neither of them the pattern of the rule that raised the alert nor the
      account's everyday activity
