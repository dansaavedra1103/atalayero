# Runtime settings. Paths are relative to the repository root.
# Any value can be overridden with ATALAYERO_* environment variables; nested fields use "__"
# (e.g. ATALAYERO_DATA_DIR=/tmp/data, ATALAYERO_DATASET__BASE_URL=...).

data_dir: data
duckdb_path: data/atalayero.duckdb
rules_dir: config/rules
alerts_dir: data/stream/alerts  # online rules over the Redpanda replay (`make stream`)
rule_alerts_dir: data/rules/alerts  # the same rules over the batch data (`make rules`)
features_dir: data/features  # point-in-time features, no labels (`make features`)
graph_workers: 4  # graph snapshots built in parallel; each process takes about 1.5 GB

# Temporal split (ADR-0005): half-open boundaries on `transacted_at`. Train starts with the data
# (1 Sep 2022). Transactions from `test_end` on are never used, not even as history.
splits:
  train_end: 2022-09-07
  validation_end: 2022-09-09
  test_end: 2022-09-11

# Alert-budget evaluation (ADR-0007). An alert is an account-day: one account's transactions of
# one day, sent and received. Detectors fill a daily budget of them.
evaluation:
  budgets: [50, 100, 200, 400]  # alerts per day; models are also compared at the rules' volume
  hub_accounts: 15  # the top senders of the train split, by transactions, reported apart
  reports_dir: data/reports

# Models (ADR-0009). Training rows start after the warm-up day (ADR-0008). MLflow runs locally
# and keeps everything under data/, so it can be rebuilt like the rest.
models:
  config_path: config/models.yaml  # hyperparameters, versioned like the rules
  train_start: 2022-09-02
  seed: 0
  mlflow_tracking_uri: sqlite:///data/mlflow/mlflow.db
  mlflow_artifacts_dir: data/mlflow/artifacts
  experiment: atalayero-detectors
  registered_model: atalayero-detector
  tuning_trials:  # Optuna trials per family for `make tune` (ADR-0010)
    logistic_regression: 15
    lightgbm: 40
    isolation_forest: 15

# Drift monitoring: PSI of each feature against train, a day at a time, weekdays against train
# weekdays and weekends against train weekends; and the daily volume of rule alerts.
drift:
  bins: 10  # quantile bins of the reference, plus one for missing values
  moderate_psi: 0.1
  significant_psi: 0.25  # a feature at or above it flags drift
  alert_volume_band: [0.5, 2.0]  # daily rule alerts against the train mean for that kind of day

# Agent evaluation (ADR-0015). Cases are account-days of the alert queue: the rules' alerts and
# the model's top `queue_budget` account-days a day, hubs left out. The dev set (validation) is
# for choosing the model and the prompts; the golden set (test) is read once per reported result.
agent_evals:
  queue_budget: 2000  # model alerts a day in the queue
  dev_cases: 30  # per group (patterned, untyped, clean), from validation
  golden_cases: 60  # per group, from test
  top_transactions: 3  # the account-day's top-scored transactions an alert carries
  seed: 0
  dir: evals  # case sets and reports, versioned
  runs_dir: data/evals/runs  # each agent run's cases, so that a run can be resumed

# Local models (ADR-0017): Ollama runs as a Docker Compose service with the GPU (`make up`).
# `make llm` pulls each model over HTTP and checks it against its pinned digest; a model pinned
# to null is pulled and its digest logged, to be pinned here.
ollama:
  url: http://localhost:11434
  models:
    "qwen3-embedding:0.6b": ac6da0dfba84a81fdbfbaf330198c33cd77c4cdfc53e8bc50eb581914a15621d
    "gpt-oss:20b": 17052f91a42e97930aa6e28a6c6c06a983e6a58dbb00434885a0cf5313e376f7  # the investigator's language model (config/agent.yaml)

# The investigator agent (ADR-0018): its versioned config, and where `make investigate` writes
# each investigation (report, verification, transcript).
agent:
  config_path: config/agent.yaml
  investigations_dir: data/agent/investigations

# Typology notes for the investigator (ADR-0017), indexed with FAISS by `make knowledge`.
knowledge:
  notes_dir: knowledge_base/typologies
  index_dir: data/knowledge
  embedding_model: "qwen3-embedding:0.6b"
  top_k: 4  # sections `search_typologies` returns by default

# IBM Transactions for Anti Money Laundering (AML), HI-Small variant. CDLA-Sharing-1.0.
# Public Kaggle endpoint: anonymous HTTPS download, one file at a time, pinned to a dataset version.
# Checksums pin the exact files: a changed or unavailable file fails the download loudly.
dataset:
  base_url: https://www.kaggle.com/api/v1/datasets/download/ealtman2019/ibm-transactions-for-anti-money-laundering-aml
  version: 8
  transactions:
    name: HI-Small_Trans.csv
    sha256: b19d39f515523373f991b689c07e11e7b0b95c17a2c27a87d91584ae16c5b040
  patterns:
    name: HI-Small_Patterns.txt
    sha256: 2c546b5ce6009e73851f0139af053cf845f08bf92f3bc82fe1eb937dec2ef39b

# Replay of the transactions through Redpanda (`make up`, then `make stream`).
streaming:
  bootstrap_servers: localhost:19092
  topic: transactions
  speedup: 0  # simulated seconds per real second; 0 = as fast as possible, 3600 = 1 h per second
  idle_timeout_seconds: 10  # once the producer is done, fail if messages stop arriving this long
