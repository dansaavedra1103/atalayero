# Local services: Redpanda (Kafka API) for the streaming replay; Ollama for the local models of
# the investigator agent, on the GPU (ADR-0017); Airflow and its Postgres for the schedules
# (ADR-0021); the API behind its gateway (ADR-0022); the dashboard (ADR-0023). `make up` writes the
# .env they read (never committed). Airflow, the gateway and the dashboard listen on localhost
# only; the API is not published at all.
services:
  redpanda:
    image: redpandadata/redpanda:v26.1.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20
  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama  # model weights survive `make down`
    environment:
      - OLLAMA_KEEP_ALIVE=30m  # keep models loaded between eval cases
      # llama-server keeps up to 8 GiB of past prompts in RAM by default; each eval case is a new
      # conversation, so that cache only takes RAM away from the WSL VM.
      - LLAMA_ARG_CACHE_RAM=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
  airflow-postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?run make up, which writes .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: atalayero-airflow:3.3.2
    # Scheduler, DAG processor, triggerer and API server in one container: enough for one
    # machine, with the LocalExecutor and Postgres for the metadata.
    command: standalone
    user: "${AIRFLOW_UID:?run make up}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"  # a batch day takes a few GB; two tasks at most
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make up}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run make up}
      # One admin; Airflow generates the password into the passwords file, under data/airflow.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/passwords.json
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      PYTHONPATH: /opt/airflow/dags  # for the DAGs' shared module, atalayero_commands
      ATALAYERO_ROOT: ${ATALAYERO_ROOT:?run make up}
      ATALAYERO_OLLAMA__URL: http://ollama:11434
    volumes:
      # The repository at the same path as on the host, so that MLflow's recorded paths resolve;
      # read-only but for data/.
      - ${ATALAYERO_ROOT}:${ATALAYERO_ROOT}:ro
      - ${ATALAYERO_ROOT}/data:${ATALAYERO_ROOT}/data
      - ${ATALAYERO_ROOT}/airflow/dags:/opt/airflow/dags:ro
      - ${ATALAYERO_ROOT}/data/airflow:/opt/airflow/state
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      airflow-postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: atalayero-api:0.4
    working_dir: ${ATALAYERO_ROOT}
    environment:
      PYTHONPATH: ${ATALAYERO_ROOT}/src
      ATALAYERO_API__KEY_HASHES: '["${ATALAYERO_API_KEY_SHA256:?run make up}"]'
    volumes:
      - ${ATALAYERO_ROOT}:${ATALAYERO_ROOT}:ro  # it reads data/serving.duckdb, nothing else
    networks: [backend]  # reachable from the gateway only
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/opt/atalayero/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:8080"
    networks: [backend, default]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
  dashboard:
    build:  # the API's image: the same project environment, from the build cache
      context: .
      dockerfile: docker/api.Dockerfile
    image: atalayero-dashboard:0.4
    entrypoint:
      - /opt/atalayero/venv/bin/streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    working_dir: ${ATALAYERO_ROOT}  # where .streamlit/config.toml turns telemetry off
    environment:
      PYTHONPATH: ${ATALAYERO_ROOT}/src
      HOME: /tmp  # Streamlit keeps its state under the home directory
    volumes:
      - ${ATALAYERO_ROOT}:${ATALAYERO_ROOT}:ro  # it reads data/serving.duckdb, nothing else
    ports:
      - "127.0.0.1:8501:8501"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/opt/atalayero/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  backend:
    internal: true  # no way out, and no way in but the gateway

volumes:
  ollama:
  airflow-postgres:
