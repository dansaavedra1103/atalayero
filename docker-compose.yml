# Local services: Redpanda (Kafka API) for the streaming replay; Ollama for the local models of
# the investigator agent, on the GPU (ADR-0017).
services:
  redpanda:
    image: redpandadata/redpanda:v26.1.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20
  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama  # model weights survive `make down`
    environment:
      - OLLAMA_KEEP_ALIVE=30m  # keep models loaded between eval cases
      # llama-server keeps up to 8 GiB of past prompts in RAM by default; each eval case is a new
      # conversation, so that cache only takes RAM away from the WSL VM.
      - LLAMA_ARG_CACHE_RAM=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  ollama:
